<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Matronics</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f4f8fc;
      color: #0b3a6e;
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("matronics_bg.png") center 42% / min(85vw, 540px) no-repeat;
      opacity: 0.38;
      pointer-events: none;
      z-index: 0;
    }
    #brand, #wrap, #credit, #status {
      position: relative;
      z-index: 1;
    }
    #brand {
      text-align: center;
      padding: 10px 12px;
      background: #0b5cab;
      border-bottom: 2px solid #084a8f;
    }
    #brand img {
      width: 28px;
      height: 28px;
      margin-right: 8px;
      border-radius: 50%;
      vertical-align: middle;
      background: #fff;
    }
    #brand b {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #ffffff;
      vertical-align: middle;
    }
    #brand .phone {
      font-size: 12px;
      color: #d6e8ff;
      margin-left: 10px;
      vertical-align: middle;
      letter-spacing: 0.02em;
    }
    #status {
      padding: 10px 18px 0;
      font-size: 14px;
      font-weight: 600;
      color: #0a2f5c;
      min-height: 22px;
    }
    #status.warn { color: #c47d0a; }
    #status.ok { color: #1a7a4c; }
    #status.bad { color: #c0392b; }
    #wrap {
      padding: 10px 18px 40px;
    }
    #console {
      white-space: pre-wrap;
      font: 12px/1.45 Consolas, monospace;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #b7cce4;
      border-radius: 5px;
      padding: 10px 12px;
      min-height: calc(100vh - 160px);
      color: #0b3a6e;
    }
    #credit {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 10px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: #5a86b5;
      opacity: 0.85;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="brand">
    <img src="logo_raw.png" alt="" width="28" height="28"><b>Matronics</b><span class="phone">+961 70962701</span>
  </div>
  <div id="status">checking offline cache...</div>
  <div id="wrap">
    <div id="console"></div>
  </div>
  <div id="credit">Made by experts from Lebanon</div>
  <script>
  (function () {
    var statusEl = document.getElementById("status");
    var started = false;

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || "";
    }

    function loadExploit() {
      if (started) return;
      started = true;
      setStatus("starting jailbreak...", "warn");

      function add(src, module) {
        var s = document.createElement("script");
        if (module) s.type = "module";
        s.src = src;
        document.body.appendChild(s);
      }

      add("./src/firmware.js", false);
      add("./src/main.js", false);
      add("./src/rop.js", false);
      add("./src/utils/syscalls.js", false);
      add("./src/site.js", true);
    }

    function waitForTap(msg, action) {
      setStatus(msg, "warn");
      function fire() {
        window.removeEventListener("click", fire);
        window.removeEventListener("keydown", fire);
        action();
      }
      window.addEventListener("click", fire);
      window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
      setStatus("cache unavailable -- running online", "bad");
      loadExploit();
      return;
    }

    if (!navigator.onLine) {
      setStatus("offline -- using cache", "ok");
      loadExploit();
      return;
    }

    if (ac.status === ac.IDLE) {
      setStatus("cached -- offline ready", "ok");
      loadExploit();
      return;
    }

    if (ac.status === ac.UPDATEREADY) {
      try { ac.swapCache(); } catch (e) {}
      waitForTap("UPDATE READY -- press X or tap to reload & run", function () {
        location.reload();
      });
      return;
    }

    setStatus("caching for offline (keep internet on)...", "warn");

    ac.addEventListener("downloading", function () {
      setStatus("caching for offline (first run)...", "warn");
    }, false);

    ac.addEventListener("progress", function (e) {
      if (e && e.total)
        setStatus("caching " + Math.round((e.loaded / e.total) * 100) + "% -- keep internet on", "warn");
    }, false);

    ac.addEventListener("cached", function () {
      setStatus("cached for offline use", "ok");
      waitForTap("CACHED -- press X or tap to run", loadExploit);
    }, false);

    ac.addEventListener("updateready", function () {
      try { ac.swapCache(); } catch (e) {}
      waitForTap("UPDATE READY -- press X or tap to reload & run", function () {
        location.reload();
      });
    }, false);

    ac.addEventListener("noupdate", function () {
      setStatus("cached -- offline ready", "ok");
      loadExploit();
    }, false);

    ac.addEventListener("error", function () {
      setStatus("cache failed -- running online anyway", "bad");
      waitForTap("CACHE FAILED -- press X or tap to run", loadExploit);
    }, false);

    ac.addEventListener("obsolete", function () {
      setStatus("cache obsolete", "bad");
      waitForTap("CACHE OBSOLETE -- press X or tap to run", loadExploit);
    }, false);

    // Safety: if status is already IDLE and no event fired, do not hang.
    setTimeout(function () {
      if (!started && ac.status === ac.IDLE) {
        setStatus("cached -- offline ready", "ok");
        loadExploit();
      }
    }, 8000);
  })();
  </script>
</body>
</html>
