<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matronics</title>
<style>
  html, body { margin:0; padding:0; min-height:100%; background:#f4f8fc; color:#0b3a6e;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; position:relative; }
  body::before {
    content:"";
    position:fixed;
    inset:0;
    background:url("matronics_bg.png") center 42% / min(85vw, 540px) no-repeat;
    opacity:0.38;
    pointer-events:none;
    z-index:0;
  }
  #brand, #wrap, #credit { position:relative; z-index:1; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; color:#0a2f5c; }
  #det { font-size:13px; color:#3d6fa3; margin:0 0 4px; }
  #det b { color:#0b3a6e; font-weight:600; }
  #cache { font-size:12px; color:#5a86b5; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#1a7a4c; }
  .ok { color:#1a7a4c; } .bad { color:#c0392b; } .warn { color:#c47d0a; }
  #brand { text-align:center; padding:10px 12px; background:#0b5cab;
           border-bottom:2px solid #084a8f; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; background:#fff; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#ffffff; vertical-align:middle; }
  #credit {
    position:fixed;
    left:0; right:0; bottom:14px;
    text-align:center;
    font-size:12px;
    letter-spacing:.06em;
    color:#5a86b5;
    opacity:0.85;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"><b>Matronics</b></div>
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>
<div id="credit">Made by experts from Lebanon</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // PS4: jb.html / jb.js (auto HEN). PS5: ps5.html / src (Press R2 for HEN).
    // PS4 list = measured kernel tables in ps4_offsets.js. PS5 list = src/firmware.js.
    var PS4_SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };
    var PS5_SUPPORTED = {
      "13.60": 1, "13.42": 1, "13.40": 1, "13.20": 1, "13.00": 1,
      "12.70": 1, "12.60": 1, "12.40": 1, "12.20": 1, "12.02": 1, "12.00": 1,
      "11.60": 1, "11.20": 1, "11.00": 1,
      "10.60": 1, "10.40": 1, "10.20": 1, "10.01": 1, "10.00": 1,
      "9.60": 1, "9.40": 1, "9.20": 1, "9.00": 1,
      "8.60": 1, "8.40": 1, "8.20": 1, "8.00": 1,
      "7.61": 1, "7.60": 1, "7.40": 1, "7.20": 1, "7.01": 1, "7.00": 1
    };

    var ua = navigator.userAgent;
    var key = null, platform = null, supported = false, target = "jb.html";
    var m5 = /PlayStation\s+5\/(\d+\.\d+)/.exec(ua);
    var m4 = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(ua);
    if (m5) {
        platform = "PS5";
        key = m5[1];
        supported = PS5_SUPPORTED[key] === 1;
        target = "ps5.html";
    } else if (m4) {
        platform = "PS4";
        var ms = parseInt(m4[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m4[1] + "." + ms;
        var fwnum = parseInt(m4[1], 10) * 100 + parseInt(ms, 10);
        supported = PS4_SUPPORTED[fwnum] === 1;
        target = "jb.html";
    }

    var forced = params.get("force") === "1";
    if (forced) supported = true;
    // force=ps5 / force=ps4 picks a chain when UA is missing (desktop test).
    if (params.get("force") === "ps5") { platform = "PS5"; target = "ps5.html"; supported = true; }
    if (params.get("force") === "ps4") { platform = "PS4"; target = "jb.html"; supported = true; }

    detEl.innerHTML = (platform ? platform + " " : "") + "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table")
        + (platform === "PS5" ? " &middot; R2 loads HEN" : "");

    target = target + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
