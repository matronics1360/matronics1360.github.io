<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Matronics</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #f4f8fc;
        color: #0b3a6e;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("matronics_bg.png") center 42% / min(85vw, 540px) no-repeat;
        opacity: 0.38;
        pointer-events: none;
        z-index: 0;
      }
      #brand,
      #wrap,
      #spin,
      #msg,
      #credit {
        position: relative;
        z-index: 1;
      }
      #brand {
        text-align: center;
        padding: 10px 12px;
        background: #0b5cab;
        border-bottom: 2px solid #084a8f;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
        background: #fff;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #ffffff;
        vertical-align: middle;
      }
      #brand .phone {
        font-size: 12px;
        color: #d6e8ff;
        margin-left: 10px;
        vertical-align: middle;
        letter-spacing: 0.02em;
      }
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #c5d8ef;
        border-top-color: #0b5cab;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        z-index: 2;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.5px;
        display: none;
        color: #0b3a6e;
        z-index: 2;
        padding: 0 16px;
      }
      #wrap {
        padding: 14px 18px;
        display: none;
      }
      #console {
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #ffffff;
        border: 1px solid #b7cce4;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 120px);
        overflow-y: auto;
        color: #0b3a6e;
      }
      body.fail #spin,
      body.wait-r2 #spin,
      body.done #spin {
        display: none;
      }
      body.fail #msg,
      body.wait-r2 #msg,
      body.done #msg {
        display: block;
      }
      body.wait-r2 #msg {
        color: #c47d0a;
      }
      body.done #msg {
        color: #0b5cab;
      }
      body.fail #msg {
        color: #c0392b;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: block;
      }
      #credit {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 14px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: #5a86b5;
        opacity: 0.85;
        pointer-events: none;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img src="logo_raw.png" alt="" width="28" height="28" /><b>Matronics</b
      ><span class="phone">+961 70962701</span>
    </div>
    <div id="spin"></div>
    <div id="msg">Starting...</div>
    <div id="wrap">
      <div id="console"></div>
    </div>
    <div id="credit">Made by experts from Lebanon</div>
    <script src="./src/firmware.js"></script>
    <script src="./src/main.js"></script>
    <script src="./src/rop.js"></script>
    <script src="./src/utils/syscalls.js"></script>
    <script type="module" src="./src/site.js"></script>
  </body>
</html>
